name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 运行测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装项目与测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: 运行测试
        run: python -m pytest tests/ -q

  build:
    name: 构建分发包
    needs: test
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 校验版本一致性（tag vs pyproject）
        run: |
          pyproject_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ -n "$GITHUB_REF_NAME" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$pyproject_version" ]; then
              echo "错误: tag $GITHUB_REF_NAME 与 pyproject.toml 版本 $pyproject_version 不一致"
              exit 1
            fi
          fi

      - name: 安装构建工具
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: 构建分发包
        run: python -m build

      - name: 生成分发包哈希值
        id: hash
        run: |
          cd dist
          hashes=$(sha256sum * | base64 -w0)
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish-to-pypi:
    name: 发布到 PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-publish:
    name: 验证发布结果
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    if: always() && needs.publish-to-pypi.result == 'success'

    steps:
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 等待索引同步
        run: sleep 30

      - name: 验证安装
        run: |
          pip install foxcode2 --no-cache-dir
          foxcode --help || echo "命令可能需要额外配置"
        continue-on-error: true
