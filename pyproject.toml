[project]
name = "foxcode"
version = "0.5.0"
description = "AI 编码代理工具 - 智能编程助手"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=2.18.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
    "prompt_toolkit>=3.0.0",
    "jedi>=0.19.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foxcode = ["*.md", "builtin_skills/**/*"]

[project.scripts]
foxcode = "foxcode.cli:main"
fc = "foxcode.cli:main"
